<style id="css">
  /* Neutrals carry a slight green bias so they read as chosen rather than
     inherited; one burnt-orange accent marks the single thing to do next, and
     nothing else in the page is allowed to use it. */
  :root {
    --ground:   #F6F8F6;
    --surface:  #FFFFFF;
    --sunk:     #EDF1EE;
    --line:     #DCE3DE;
    --line-2:   #C7D1CB;
    --ink:      #141817;
    --ink-2:    #58635E;
    --ink-3:    #8B948F;
    --accent:   #B4531A;
    --accent-b: #B4531A18;
    --done:     #3F6B4A;
    --shadow:   0 1px 2px #0F1A140F, 0 8px 24px -18px #0F1A1433;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:   #0F1312;
      --surface:  #171C1A;
      --sunk:     #1E2422;
      --line:     #29312E;
      --line-2:   #3A443F;
      --ink:      #E9EEEB;
      --ink-2:    #9AA49F;
      --ink-3:    #6D7772;
      --accent:   #F08A3C;
      --accent-b: #F08A3C1F;
      --done:     #74B184;
      --shadow:   0 1px 0 #FFFFFF08 inset, 0 12px 32px -22px #000000CC;
    }
  }

  :root[data-theme="dark"] {
    --ground:   #0F1312;
    --surface:  #171C1A;
    --sunk:     #1E2422;
    --line:     #29312E;
    --line-2:   #3A443F;
    --ink:      #E9EEEB;
    --ink-2:    #9AA49F;
    --ink-3:    #6D7772;
    --accent:   #F08A3C;
    --accent-b: #F08A3C1F;
    --done:     #74B184;
    --shadow:   0 1px 0 #FFFFFF08 inset, 0 12px 32px -22px #000000CC;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 47rem;
    margin: 0 auto;
    padding: clamp(1.6rem, 5vw, 3.4rem) clamp(1rem, 4vw, 2rem) 5rem;
    display: flex;
    flex-direction: column;
    gap: 2.1rem;
  }

  h1, h2, .next-kicker {
    font-family: "Bricolage Grotesque", "Segoe UI Semibold", system-ui, sans-serif;
  }

  h1 {
    font-size: clamp(1.7rem, 4.4vw, 2.3rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0;
    text-wrap: balance;
  }

  .sub { color: var(--ink-2); margin: 0.35rem 0 0; max-width: 34rem; }

  .meter {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-top: 1rem;
    font-size: 0.85rem;
    color: var(--ink-2);
  }
  .meter .track {
    flex: 1;
    max-width: 12rem;
    height: 5px;
    border-radius: 3px;
    background: var(--sunk);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .meter .fill {
    height: 100%;
    background: var(--done);
    width: 0;
    transition: width 0.25s ease;
  }
  .meter b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ---------- the one next thing ---------- */
  .next {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 5px;
    padding: 1.15rem 1.25rem;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .next-kicker {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .next h2 { font-size: 1.22rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .next p { margin: 0; color: var(--ink-2); }
  .next .watch { margin: 0.35rem 0 0; padding-left: 1.05rem; display: flex; flex-direction: column; gap: 0.3rem; }
  .next .watch li { color: var(--ink-2); }
  .next .watch li::marker { color: var(--accent); }

  /* ---------- groups ---------- */
  .group { display: flex; flex-direction: column; gap: 0.55rem; }
  .group-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding-bottom: 0.35rem;
    border-bottom: 1px solid var(--line);
  }
  .group-head h2 {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin: 0;
  }
  .group-head .count {
    font-size: 0.76rem;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* ---------- item ---------- */
  .item {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 0.7rem 0.85rem;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.15rem 0.75rem;
  }
  .item.is-done { background: transparent; border-color: var(--line); }

  .tick {
    grid-row: 1 / span 3;
    width: 1.45rem;
    height: 1.45rem;
    margin-top: 0.12rem;
    border-radius: 4px;
    border: 1.5px solid var(--line-2);
    background: var(--sunk);
    display: grid;
    place-items: center;
    cursor: pointer;
    padding: 0;
    color: transparent;
    flex: none;
  }
  .tick:hover { border-color: var(--ink-3); }
  .tick[aria-checked="true"] {
    background: var(--done);
    border-color: var(--done);
    color: #fff;
  }
  .tick svg { width: 0.85rem; height: 0.85rem; display: block; }
  .tick[disabled] { cursor: default; opacity: 0.55; }

  .title {
    font-weight: 600;
    line-height: 1.35;
    align-self: center;
  }
  .is-done .title { text-decoration: line-through; color: var(--ink-3); font-weight: 500; }

  .meta {
    grid-column: 2;
    font-size: 0.78rem;
    color: var(--ink-3);
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    align-items: center;
  }
  .meta .effort {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    background: var(--sunk);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0.05em 0.4em;
    white-space: nowrap;
  }
  .meta .flag {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--done);
  }

  details.why { grid-column: 2; margin-top: 0.3rem; }
  details.why > summary {
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--ink-2);
    list-style: none;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.1rem 0;
  }
  details.why > summary::-webkit-details-marker { display: none; }
  details.why > summary::before {
    content: "";
    width: 0; height: 0;
    border-left: 4px solid currentColor;
    border-top: 3.5px solid transparent;
    border-bottom: 3.5px solid transparent;
    transition: transform 0.15s ease;
  }
  details.why[open] > summary::before { transform: rotate(90deg); }
  details.why > summary:hover { color: var(--ink); }
  .why-body {
    margin: 0.4rem 0 0.15rem;
    padding-left: 0.72rem;
    border-left: 2px solid var(--line);
    color: var(--ink-2);
    font-size: 0.92rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .why-body p { margin: 0; }
  .why-body code {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.86em;
    background: var(--sunk);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0.03em 0.3em;
  }

  /* ---------- parked ---------- */
  details.parked {
    background: var(--sunk);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 0.7rem 0.9rem;
  }
  details.parked > summary {
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-2);
    list-style: none;
  }
  details.parked > summary::-webkit-details-marker { display: none; }
  details.parked ul { margin: 0.75rem 0 0.2rem; padding-left: 1.05rem; display: flex; flex-direction: column; gap: 0.5rem; }
  details.parked li { color: var(--ink-2); font-size: 0.93rem; }
  details.parked li::marker { color: var(--ink-3); }
  details.parked strong { color: var(--ink); font-weight: 600; }

  footer {
    border-top: 1px solid var(--line);
    padding-top: 0.9rem;
    font-size: 0.82rem;
    color: var(--ink-3);
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1rem;
    justify-content: space-between;
  }
  #saving { color: var(--ink-3); font-size: 0.82rem; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 30rem) {
    .item { padding: 0.65rem 0.7rem; }
  }
</style>

  var GROUPS = [
    {
      id: "you",
      name: "Needs you",
      note: "I can’t do these for you",
      items: [
        {
          id: "charge-sound",
          title: "Pick a charge sound for the lance and the ram",
          effort: "30 min",
          why: [
            "Done, and synthesised rather than picked. Nothing in the packs is a charge — measured, every engine and thruster is a flat five-second drone and the only things that rise are door slams — so both were made with the project’s own SfxrSynth, called directly rather than through the menu item that would have replaced every sound in the game.",

          effort: "a build + one run, ~25 minutes",
          why: [
            "Done on 11 September, on <code>Builds/26_0911-1350_fogbake_cheats</code>: commit <code>29c9df5</code> with the debug menu in, skipped to the boss, god mode on. You answered through a page rather than out loud: <a href='https://claude.ai/code/artifact/55981164-2b84-46de-ad57-cb81e40d86c0'>Fogbake Playtest</a>.",
            "<strong>Settled, with nothing to do:</strong> the island split stays, since you could not tell the difference and it costs nothing. The fight is the right length, so the health numbers stay. And you always found the pods. The pod and lance decisions below both close on this run.",
            "<strong>Turned into work,</strong> each its own item: the fog flicker and cost (now at the top), the lance as energy, clearer warnings on the boss’s attacks, the Armoured act’s fire taking different routes, the ship’s handling, the dash, a thruster effect for the ship, and a proposal to shrink the player and small enemies by a quarter.",
            "One caveat runs through all of it: <strong>god mode was on</strong>. A fight you never have to dodge is a fight you finish faster, so ‘right length’ is a floor rather than a measurement, and a boss that cannot hurt you is scenery almost by definition. Both of those answers want one run without it before much is built on them."

            "Inspected on 10 September, in the editor rather than in play. Beside the dark hull they are conspicuous — and shape and placement are doing more of that work than colour is. But their cores measured bright yellow-orange with red halos, which is most of the lava’s own range.",

            "From the second polish pass. Each is a matter of feel with its dial, set to what the roadmap proposed: the Leviathan’s death at 2.5 s, a quarter speed after a 0.15 s hold; enemies growing in over 0.4 s and keeping 30° clear of the ship; the end card’s buttons held for 0.6 s; the music out in 0.4 s and in over 1 s.",

        },

        },

            "The dials: the boss stream’s <code>Start Delay</code> and <code>Stop Spawning At</code> in <code>MainRun</code> set the length, and the streams’ start delays and ramp steps have to move with them; <code>Experience Multiplier</code> on the Player sets how often you level.",
            "<strong>If you do not flag it:</strong> the run stays 400 s with these numbers.",

            "The dial is the two tables in <code>CloudLadder</code>: 256 and 32 on High marches twice as far, for about 0.7 ms more going by 256 and 24.",

          effort: "10 min",
          why: [

        },
        {

          why: [

            "<strong>If you do not flag it:</strong> the counts and the ship lights stand, and the cloud test for item 40 goes ahead."

    }
  ];

  var PARKED = [
    ["Cloud shadow resolution as a quality rung", "Built on 16 September as 128/256/512, measured, and collapsed the same day. Against a control of two captures at one setting, every step of the ladder moved less of the frame than the clouds’ own reprojection does between frames. The Shadows row decides whether the clouds cast; their sharpness stays at the scene’s 256."],
    ["A fog Ultra tier above High", "Asked for on 14 September once the flicker was fixed, then cancelled before anything was built. The row stops at High, which is budget 0.333."],
    ["A TrailRenderer behind the rounds", "Tried on 14 September and replaced the same day. Under FSR, any trail built from past positions drifts off its round when the camera moves, whatever its material does, so the rounds carry a rigid streak instead."],
    ["The pale facets on the cone are not a bake artifact", "Chased on 10 September and dropped. The rock shows grey, desaturated faces next to deep red ones, and it looks like lightmap patchwork — it is not. The island is lit almost entirely by warm lava lights that are Mixed and therefore baked, so a face angled away from the lava receives only the cool sky ambient and reads grey. That is correct shading on flat-shaded low-poly rock. Two false starts are worth remembering: detaching the lightmap to test it proves nothing, because that removes nearly all the light on that rock at once; and comparing screenshots across the rebake proves nothing either, because the fog changed in the same step. Holding fog constant at 15 and re-rendering, the rebake made that flank about 10% darker and marginally less saturated, with 17% of pixels moving more than 12/255 — consistent with one fewer lava light, and nothing else. The facets were always there; the thinner fog stopped veiling them."],
    ["The world at ten times its size", "Tried on a branch, taken all the way to playable, and reversed on 9 September. It is not coming back: the scale bought nothing the importer could not, and the price was every number in the project and its documentation being wrong at once. What survives it is one piece of knowledge — a collider radius under a scaled root is a local number and rides the transform, a light range is handed to HDRP in world units and does not."],
    ["The boss HUD, the camera pull-back and the pink palette", "A readability pass on 8 September added a HUD naming the phase and the three targets, pulled the camera back during the fight, rewrote the dash tutorial and moved all hostile fire to pink with green pods. Reverted the same day; the four correctness fixes underneath it were kept. Only the colour half is still an open question — see “Decide whether the red pods actually read in play” above."],
    ["The wreckage plates stay dark", "Asked on 7 September and answered: no glow for now. They carry the boss’s hull material, which is nearly black, so one can vanish against the dark island — worth revisiting if the boss run shows it happening, but it is a deliberate no rather than an open question."],
    ["Replacing an offer that is still out", "Levelling again while an offer is still out puts a second set on the ring rather than replacing the first — deliberate, because replacing it would delete an upgrade you earned. Since 28 September the new set turns clear of the ones already out, so the two no longer land on top of each other."],
    ["The cloud bank’s drift, switched off", "Never tried. The bank was taken out of the scene on 5 September and deleted on 28 September, so there is nothing left to slow."],
    ["The fireflies", "Built and archived on 17 September; on 28 September you left them out for good. Assets/Prefabs/VFX/Fireflies.prefab keeps all of it, and dragging it into the scene brings them back."],
    ["Measuring enemy shots against the lava", "A low-confidence reading from one frame on 10 September. Dropped on 28 September: the pods, a bigger target with the same cause, passed in play, and no shot has gone missing in a run."],
    ["Matching clips on windowed loudness", "Parked on 28 September. It would rewrite every file in Balanced/, and the mix is stable. Worth doing only if the mix drifts again; the new hit changed one sound and left the rest where they were."],
    ["Salvage by a chance per kill", "The obvious way to pace it, passed over on 22 September for a clock. The bot’s two runs killed about two enemies a second and about one, so odds per kill would have paid one player twice what they paid the other for the same wounds."],
    ["Max Health is four ×5 instead of one ×20", "Same ceiling for a player who takes all four, lower for one who takes two. Whether that reads as a choice or a nerf is a question only playing answers."],
    ["Ray-traced rungs beyond reflections are unvalidated", "RT Reflections was confirmed in a build on DXR hardware. The rest are reachable and deliberately unused."],
    ["The DLSS path has never executed", "The dev machine is a Radeon, and HDRP requires an NVIDIA vendor string. The rows are correctly hidden; the code is unit-tested but has never run."],
    ["ActualRenderScale is not a bug", "Checked it — the two render-scale numbers can legitimately disagree, and the report shows both on purpose so you can see which is wrong."],
    ["FSR 3\u2019s frame generation", "Left out on 29 September. It needs to take over the swap chain, which Unity owns, so the upscaler came alone."],
    ["FSR 2 as a fallback on DirectX 11", "Removed with the rest of FSR 2 on 29 September, at your pick. FSR 3 needs DirectX 12, which the game asks for first, so only a machine that falls back to DirectX 11 goes without FSR."],
    ["A ship you ram goes up", "Roadmap 2, item 18, answered no on 30 September. Ramming still takes the enemy off the ring without an explosion or a sound."],
    ["A moment’s grace after a hit", "Roadmap 2, item 20, answered no on 30 September. Two rounds from one volley can still take two hit points at once; the dash and the Deflector stay the only protection."],
    ["Rebinding the keys", "Roadmap item 16, answered ‘not now’ on 30 September. The game reads each key directly, so rebinding means moving input onto Input System actions and adding a rebind per action to the Controls tab, about a day and a half. Worth it once other people play the game, and not before."],
    ["A reflection probe for the lava", "Environment roadmap, item 34, measured on 5 October and not built. A probe at the island’s centre, as the roadmap drew it, would have shown each ship the far side of the island and not the side it faces. One placed on the lane beside the ships, which is the right place, changed 0.009% of the picture against a floor of 0.007%. The fill light on the ships already puts the orange glint on canopies."],
    ["Lightning in the ash plume", "Environment roadmap, item 39, answered later on 5 October. It only reads once the plume is denser, and it is a flash in a game where you track small rounds. If it goes in, it stays rare and soft."],
    ["Far trees and ruins without their twigs", "Environment roadmap, item 47, answered later on 5 October. A second level of detail with the twigs and window bars removed, to stop the far edge crawling. Judge it after the cloud and sky items, which change what sits behind that edge."]
  ];

  var ALL = [];
  GROUPS.forEach(function (g) { g.items.forEach(function (it) { ALL.push(it); }); });
  ALL.push(NEXT);

  var stateEl = document.getElementById("state");
  var state;
  try { state = JSON.parse(stateEl.textContent) || {}; } catch (e) { state = {}; }
  if (!state.done || typeof state.done !== "object") { state.done = {}; }

  var writable = true;
  var pending = null;
  var api = null;

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // "why" copy is authored here and may carry <code>; everything from state is escaped.
  function tickSvg() {
    return '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.4l3 3 6-6.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function itemHtml(it, groupNote) {
    var isDone = !!state.done[it.id];
    var why = (it.why || []).map(function (p) { return "<p>" + p + "</p>"; }).join("");
    return '' +
      '<div class="item' + (isDone ? " is-done" : "") + '" data-id="' + esc(it.id) + '">' +
        '<button class="tick" type="button" role="checkbox" aria-checked="' + (isDone ? "true" : "false") +
          '" aria-label="' + esc(it.title) + '"' + (writable ? "" : " disabled") + '>' + tickSvg() + '</button>' +
        '<div class="title">' + esc(it.title) + '</div>' +
        '<div class="meta">' +
          '<span class="effort">' + esc(it.effort) + '</span>' +
          (isDone ? '<span class="flag">done</span>' : "") +
        '</div>' +
        (why ? '<details class="why"><summary>why</summary><div class="why-body">' + why + "</div></details>" : "") +
      "</div>";
  }

  function render() {
    var doneCount = 0;
    ALL.forEach(function (it) { if (state.done[it.id]) { doneCount++; } });
    var pct = ALL.length ? Math.round((doneCount / ALL.length) * 100) : 0;

    var nextDone = !!state.done[NEXT.id];

    var html = '' +
      "<header>" +
        "<h1>Survival Chaos — what’s left</h1>" +
        '<p class="sub">A living list. Tick something and it stays ticked for anyone who opens this. Nothing here is urgent and nothing here is overdue.</p>' +
        '<div class="meter">' +
          '<div class="track"><div class="fill" style="width:' + pct + '%"></div></div>' +
          "<span><b>" + doneCount + "</b> of <b>" + ALL.length + "</b> done</span>" +
          '<span id="saving"></span>' +
        "</div>" +
      "</header>";

    html += '' +
      '<section class="next">' +
        '<div class="next-kicker">' + (nextDone ? "Next · done" : "Start here") + "</div>" +
        "<h2>" + esc(NEXT.title) + "</h2>" +
        "<p>" + NEXT.lede + "</p>" +
        '<ul class="watch">' + NEXT.watch.map(function (w) { return "<li>" + esc(w) + "</li>"; }).join("") + "</ul>" +
        '<div class="group" style="margin-top:.5rem">' + itemHtml(NEXT) + "</div>" +
      "</section>";

    GROUPS.forEach(function (g) {
      var gd = 0;
      g.items.forEach(function (it) { if (state.done[it.id]) { gd++; } });
      html += '<section class="group">' +
        '<div class="group-head"><h2>' + esc(g.name) + '</h2>' +
        '<span class="count">' + gd + " / " + g.items.length + " · " + esc(g.note) + "</span></div>" +
        g.items.map(function (it) { return itemHtml(it); }).join("") +
        "</section>";
    });

    html += '<details class="parked"><summary>Decided — not doing (' + PARKED.length + ")</summary><ul>" +
      PARKED.map(function (p) { return "<li><strong>" + esc(p[0]) + ".</strong> " + esc(p[1]) + "</li>"; }).join("") +
      "</ul></details>";

    html += "<footer><span>Last edited by Claude: " + esc(state.updated || "") + "</span>" +
      "<span>" + (writable ? "Ticks save automatically" : "Read-only view — ticks won’t save") + "</span></footer>";

    document.getElementById("app").innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll(".tick"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.closest(".item").getAttribute("data-id");
        toggle(id);
      });
    });
  }

  function say(msg) {
    var el = document.getElementById("saving");
    if (el) { el.textContent = msg; }
  }

  function toggle(id) {
    if (!writable) { return; }
    if (state.done[id]) { delete state.done[id]; } else { state.done[id] = true; }
    render();
    say("saving…");
    schedulePublish();
  }

  // Batch rapid ticks into one publish; publish only after someone acts.
  function schedulePublish() {
    if (pending) { clearTimeout(pending); }
    pending = setTimeout(publish, 700);
  }

  function buildDoc() {
    var css = document.getElementById("css").textContent;
    var src = document.getElementById("app-src").textContent;
    var fonts = document.getElementById("fontlink").outerHTML;
    var open = "<" + "script";
    var close = "<" + "/script>";
    return "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n" +
      "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n" +
      "<title>Survival Chaos — Open List</title>\n" + fonts + "\n" +
      "<style id=\"css\">" + css + "</style>\n</head>\n<body>\n" +
      "<div class=\"wrap\" id=\"app\"></div>\n" +
      open + " id=\"state\" type=\"application/json\">" + JSON.stringify(state) + close + "\n" +
      open + " id=\"app-src\">" + src + close + "\n" +
      "</body>\n</html>";
  }

  var waitedForApi = 0;

  function publish() {
    pending = null;
    // A tick can land before use("artifact") has resolved. Wait for it a couple
    // of times rather than dropping the edit on the floor.
    if (!api) {
      if (writable && waitedForApi < 12) { waitedForApi++; schedulePublish(); return; }
      say("");
      return;
    }
    waitedForApi = 0;
    api.publish(buildDoc()).then(function () {
      say("saved");
      setTimeout(function () { say(""); }, 1600);
    }).catch(function (err) {
      var code = err && err.code;
      if (code === "conflict") {
        // Someone published first; every view reloads to the winner. No retry.
        say("");
        return;
      }
      if (code === "not_granted" || code === "not_writer") {
        writable = false;
        render();
        return;
      }
      say("couldn’t save");
    });
  }

  render();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (a) {
      if (!a) { writable = false; render(); return; }
      api = a;
    }).catch(function () { writable = false; render(); });
  } else {
    writable = false;
    render();
  }
})();
</script>
