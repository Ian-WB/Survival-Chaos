<style id="css">
  /* Neutrals carry a slight green bias so they read as chosen rather than
     inherited; one burnt-orange accent marks the single thing to do next, and
     nothing else in the page is allowed to use it. */
  :root {

    --surface:  #FFFFFF;
    --sunk:     #EDF1EE;

      --ink-2:    #9AA49F;

      --shadow:   0 1px 0 #FFFFFF08 inset, 0 12px 32px -22px #000000CC;

  }

  :root[data-theme="dark"] {

    --surface:  #171C1A;
    --sunk:     #1E2422;
    --line:     #29312E;
    --line-2:   #3A443F;

    --ink-2:    #9AA49F;
    --ink-3:    #6D7772;
    --accent:   #F08A3C;
    --accent-b: #F08A3C1F;
    --done:     #74B184;

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;

  .wrap {
    max-width: 47rem;

    display: flex;
    flex-direction: column;

  h1, h2, .next-kicker {

  }

  h1 {
    font-size: clamp(1.7rem, 4.4vw, 2.3rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0;
    text-wrap: balance;
  }

  .sub { color: var(--ink-2); margin: 0.35rem 0 0; max-width: 34rem; }

  .meter {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-top: 1rem;
    font-size: 0.85rem;
    color: var(--ink-2);
  }
  .meter .track {
    flex: 1;
    max-width: 12rem;
    height: 5px;
    border-radius: 3px;
    background: var(--sunk);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .meter .fill {
    height: 100%;
    background: var(--done);
    width: 0;
    transition: width 0.25s ease;
  }
  .meter b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ---------- the one next thing ---------- */
  .next {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 5px;

    box-shadow: var(--shadow);

    flex-direction: column;
    gap: 0.5rem;

  .next-kicker {

    letter-spacing: 0.16em;

  /* ---------- groups ---------- */
  .group { display: flex; flex-direction: column; gap: 0.55rem; }
  .group-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;

    font-size: 0.76rem;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;

  /* ---------- item ---------- */
  .item {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 0.7rem 0.85rem;

  .item.is-done { background: transparent; border-color: var(--line); }

  .tick {
    grid-row: 1 / span 3;
    width: 1.45rem;
    height: 1.45rem;
    margin-top: 0.12rem;
    border-radius: 4px;
    border: 1.5px solid var(--line-2);

    display: grid;
    place-items: center;
    cursor: pointer;
    padding: 0;
    color: transparent;
    flex: none;
  }
  .tick:hover { border-color: var(--ink-3); }
  .tick[aria-checked="true"] {
    background: var(--done);
    border-color: var(--done);
    color: #fff;
  }
  .tick svg { width: 0.85rem; height: 0.85rem; display: block; }
  .tick[disabled] { cursor: default; opacity: 0.55; }

  .title {
    font-weight: 600;
    line-height: 1.35;
    align-self: center;
  }
  .is-done .title { text-decoration: line-through; color: var(--ink-3); font-weight: 500; }

  .meta {
    grid-column: 2;
    font-size: 0.78rem;
    color: var(--ink-3);
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    align-items: center;
  }
  .meta .effort {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.72rem;

    padding: 0.05em 0.4em;

  }
  .meta .flag {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--done);
  }

  details.why { grid-column: 2; margin-top: 0.3rem; }
  details.why > summary {
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--ink-2);
    list-style: none;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.1rem 0;
  }
  details.why > summary::-webkit-details-marker { display: none; }
  details.why > summary::before {
    content: "";
    width: 0; height: 0;
    border-left: 4px solid currentColor;
    border-top: 3.5px solid transparent;
    border-bottom: 3.5px solid transparent;
    transition: transform 0.15s ease;
  }
  details.why[open] > summary::before { transform: rotate(90deg); }
  details.why > summary:hover { color: var(--ink); }
  .why-body {
    margin: 0.4rem 0 0.15rem;
    padding-left: 0.72rem;
    border-left: 2px solid var(--line);
    color: var(--ink-2);
    font-size: 0.92rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .why-body p { margin: 0; }
  .why-body code {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.86em;
    background: var(--sunk);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0.03em 0.3em;
  }

  /* ---------- parked ---------- */
  details.parked {
    background: var(--sunk);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 0.7rem 0.9rem;
  }
  details.parked > summary {
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-2);
    list-style: none;
  }
  details.parked > summary::-webkit-details-marker { display: none; }
  details.parked ul { margin: 0.75rem 0 0.2rem; padding-left: 1.05rem; display: flex; flex-direction: column; gap: 0.5rem; }
  details.parked li { color: var(--ink-2); font-size: 0.93rem; }
  details.parked li::marker { color: var(--ink-3); }
  details.parked strong { color: var(--ink); font-weight: 600; }

  footer {
    border-top: 1px solid var(--line);
    padding-top: 0.9rem;
    font-size: 0.82rem;
    color: var(--ink-3);
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1rem;
    justify-content: space-between;
  }
  #saving { color: var(--ink-3); font-size: 0.82rem; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 30rem) {
    .item { padding: 0.65rem 0.7rem; }
  }
</style>

    lede: "Built on 17 September as <code>Builds/26_0917-1314_archived</code> from commit <code>bcc644b</code>, debug menu in. It supersedes the 16 September build, which was never played, so <strong>everything that was in that one is in this one</strong>.</p><p><strong>Shadows are a setting.</strong> A row on the Graphics screen, Off to High, reaching the sun, the lava light that casts and the clouds. Off is not the quiet rung it sounds like: with nothing occluding the lava light the whole island reads flat and washed out.</p><p><strong>The lightmaps are compressed.</strong> You rebaked at High Quality compression, which took the build from about 857 MB to 684. If it costs anything it shows as banding on large smooth gradients.</p><p><strong>Pickups pop now.</strong> Collecting one spawns a cyan energy burst. That field had been empty since pickups were added, so this is the first build in which taking one does anything at all visually.</p><p><strong>Scale.</strong> The player and the normal enemies are half size, and so are their rounds, with volleys packed at half the spacing. Your radius offset of 5 moves the whole lane to 18.72: enemies, boss, pickups and camera go with it.</p><p><strong>Hits.</strong> Three separate reasons a round could miss are fixed: enemies that settled off the lane, Enemy 1 and Enemy 2 sitting above or below your line of fire, and rounds skipping straight through hitboxes between physics steps, which a held-target test put at about one round in three. With the sweep in, 98% or more connect.</p><p><strong>Not in it: the fireflies.</strong> They were built, measured and archived to a prefab on 17 September while you decide, so the island looks as it did on 16 September apart from the pickup burst.</p><p>God mode stayed on in the last playtest, so whether the boss is a threat and whether the fight is the right length are both still open. This run is the one that answers them.",
    watch: [

            "A third run on 8 September said it felt good but ran long. That is what cut the armoured act from 450 to 300 and the boss from 900 to 750 — that act alone was half the whole bar, and the only one that made you fly between three heights, so it owned a disproportionate share of the clock.",
            "Everything the fight is tuned to now came out of those runs rather than out of a probe with the ship parked."
          ]
        },
        {
          id: "play-islandsplit",
          title: "Build the current state and play it",
          effort: "a build + one run, ~25 minutes",
          why: [
            "Done on 11 September, on <code>Builds/26_0911-1350_fogbake_cheats</code>: commit <code>29c9df5</code> with the debug menu in, skipped to the boss, god mode on. You answered through a page rather than out loud: <a href='https://claude.ai/code/artifact/55981164-2b84-46de-ad57-cb81e40d86c0'>Fogbake Playtest</a>.",
            "<strong>Settled, with nothing to do:</strong> the island split stays, since you could not tell the difference and it costs nothing. The fight is the right length, so the health numbers stay. And you always found the pods. The pod and lance decisions below both close on this run.",
            "<strong>Turned into work,</strong> each its own item: the fog flicker and cost (now at the top), the lance as energy, clearer warnings on the boss’s attacks, the Armoured act’s fire taking different routes, the ship’s handling, the dash, a thruster effect for the ship, and a proposal to shrink the player and small enemies by a quarter.",

          title: "Pick a punchier clip for taking damage",

            "The pods were green until 5 September, and the comment written when they turned red flagged the cost at the time: a red pod against orange lava is a harder read than a green one was, and this would be the first thing to question if the armoured phase turned out to be hard to aim at.",
            "On 8 September a second pass reached the same diagnosis from scratch and moved every hostile thing off orange — pink fire, green pods. You reverted it, and its version did wash a third of the island green. But that rejects the execution, not the diagnosis.",
            "The lever this item used to name has moved. <code>PodLightLumens</code> was 9000 and is now 90, because every light divided by a hundred when the world divided by ten — and the pod lights’ <code>range</code> came down from 60 to 6 on top of that, since range is the one light property that does not ride the boss transform. So the pods are already dimmer and tighter than the ones you were judging. Whether they read is a fresh look now, not the old one.",
            "Inspected on 10 September, in the editor rather than in play. Beside the dark hull they are conspicuous — and shape and placement are doing more of that work than colour is. But their cores measured bright yellow-orange with red halos, which is most of the lava’s own range.",
            "Then seen in the boss fight the same day, and <strong>the cause is not what either previous attempt assumed</strong>. Brightness was never the problem — the pods are among the brightest things on screen. Nor is hue: their emissive measures <code>(1.00, 0.04, 0.02)</code>, near-pure red, and <em>more</em> saturated than the boss’s own rounds at <code>(1.00, 0.23, 0.01)</code>. What fails is intensity. The cores blow out to white-yellow in the tonemapper, which is exactly what the lava fountain blows out to, so hue survives only in the halo and a pod crossing the lava stops being separable from it.",
            "So the lever is exposure or emissive intensity, not colour — a different fix from both the red and the green, and one that leaves the palette alone.",
            "<strong>Closed by the 11 September playtest: you always found them.</strong> So the brightness cut this item was building toward is not needed, and the pods stay exactly as they are. If a later run loses them over the lava, the cause and the lever are both written above."

        {

          title: "Decide whether the lance beam reads",
          effort: "2 min to decide",
          why: [
            "The forty rounds are gone. They could not be separated by construction: each round was longer than the gap between consecutive shots, so they overlapped whatever the cadence did, and staggering the four prow muzzles only reached the half of the problem timing could touch.",

            "Inspected on 10 September against both the sky and a darker background: one continuous orange arc with a defined core and edges, clearly distinct from the separate rounds near it. That is the design question answered — it is a beam, not a smear.",
            "Seen firing on 10 September, in the boss fight, for the first time in any build. <strong>It reads.</strong> A solid, hard-edged bright bar, unmistakable at a glance and nothing like a smear. The legibility question this item was built around is answered.",
            "What is left is taste rather than legibility: it reads as a solid plank more than as energy — uniform fill, hard edges, no falloff along its length. That may be exactly right for a siege weapon, which is why it is still your call and not mine.",

        {

          effort: "5 min to decide",

            "From your playtest note: the arena and the boss feel small, so maybe cut the player and the small enemies by 25%. It goes after the same feeling the 10× world was chasing, by the cheap route. The world keeps every number it has and simply gets bigger around the things you watch.",
            "What it costs, before you pick. Hitboxes shrink with the models unless they are kept on purpose, so a smaller ship dodges more easily and smaller enemies are harder to hit. That makes it a difficulty change as well as a look. It also shrinks the ship against the 8.9-unit flight band, which should make the band feel taller, possibly the best part of it.",
            "Cheap to try either way. Model scale lives in the importer now, so it is one number per model plus a decision about colliders. It wants a build to judge rather than a still.",
            "<strong>Decided and done on 11 September, at half rather than a quarter.</strong> The player and the four normal enemies are 0.5; the boss, the bullets and the arena are untouched. Done through the importers: Scale Factor ×0.5 on the five ship models, each of which has exactly one user.",
            "Two prefabs were detached copies of their models, the trap that once collapsed the arena into a heap: <code>PlayerSpaceShip</code> and the base <code>Enemy</code>. Both were re-attached first, with the base enemy’s hand edits carried across as overrides (a flipped spike, a hidden one, a slight stretch). A snapshot proved nothing moved. Then everything the prefabs author themselves was halved: hitboxes, gun pivots, and where each model sits under its root. A second snapshot proved every mesh, hitbox and pivot came out at exactly half.",
            "<strong>Hitboxes shrank with the ships,</strong> so this is a difficulty change as well as a look. You are harder to hit, and the enemies are harder to hit too. Against the boss, the band where a round can touch you narrowed from about ±0.33 to ±0.21, so a round from its outermost gun takes about 0.36 s to become dangerous instead of 0.275. The boss’s own numbers are unchanged. <code>RoundLaneResponse</code> 6.6 would restore the old timing if the fight goes soft.",
            "On 14 September the rounds followed the ships to half size, and the player’s radius offset became an offset for the whole lane. Both are their own items."
          ]
        },
        {
          id: "enemy3-silhouette",
          title: "Decide how to lift enemy contrast against the island",

          why: [
            "This item was about Enemy 3 alone. The measurement says that was the wrong target.",
            "Measured on 10 September by rendering each frame twice — once with a type hidden — and diffing, which yields the object’s exact pixels and the true background behind them. Two earlier attempts that sampled a patch against a ring of background pixels gave <em>opposite</em> answers depending on the ring radius, and were thrown out rather than reported.",

            "<code>IntentDb</code> is currently carrying both the design judgement it is for and a correction for that gap, which is written down as the compromise it is. Fixing the metric would let it go back to being purely about how often a sound fires — but it rewrites every file in <code>Balanced/</code>, so it wants doing deliberately rather than in passing."
          ]
        },
        {
          id: "shadow-count",
          title: "Drop shadowCastingCount from 4 to 2",
          effort: "2 min",
          why: [
            "Done on 8 September. The player’s bullet pool is at 2. The enemy pool was already at 0 and stays there — their shots glow but cast nothing.",
            "It cost nothing late in a run — once Shot Upgrade lands only two volleys are lit — but meant four casters in the opening minute, when every bullet is its own volley and there is least else on screen to justify them."
          ]
        },
        {
          id: "identity",
          title: "Give the game its own identity",
          effort: "5 min",
          why: [
            "Done on 8 September: <code>Ian Wanderley</code> / <code>Survival Chaos</code> / <code>0.9.0</code>, with an explicit <code>com.ianwanderley.survivalchaos</code> rather than the identifier Unity derives.",
            "The company name is the least settled of the four. Nothing in the repo records a team name for the original five, so it came from your own git author name — it is one field and changes on a word. Note it also moves where settings live, so one previous build’s graphics and audio choices will not be found the first time."
          ]
        },
        {
          id: "stray-log",
          title: "Untrack replay_pid25368.log",
          effort: "2 min",
          why: [
            "Done on 8 September. Untracked, deleted, and <code>replay_pid*.log</code> added to .gitignore so the next one is never staged in the first place."
          ]
        },
        {
          id: "commit-files",
          title: "Clear the commit-*.txt scratch files",
          effort: "1 min",
          why: [
            "Done on 8 September. All three deleted from the outer folder — every one of them had been committed long before."
          ]
        },
        {
          id: "code-variant",
          title: "Set the Managed Code Variant back to Release",
          effort: "1 min",
          why: [
            "Done, and done again every time since: it goes to <strong>Checked</strong> for the length of a debug build and straight back to <strong>Release</strong> afterwards, so the repo never sits in the state that ships a menu handing out levels and invulnerability. It went both ways again on 10 September for the cheat build sitting beside the one at the top of this list.",
            "Unity 6.6 moved this off the Development Build checkbox and onto a dropdown in Player Settings, so ticking that box no longer brings the menu back. Ask for a debug build and I will flip it both ways around the build — the exe keeps its menu either way, since the setting only affects the next one.",
            "<strong>From 11 September it runs the other way round.</strong> You asked for every build to carry the debug menu unless you say otherwise, so Checked is the default and Release is the build you ask for by name. The committed setting still stays Release and is flipped around each build, so the repo itself never holds the menu."
          ]
        }
      ]
    },
    {
      id: "later",
      name: "Waiting on a real run",
      note: "Blocked until something is played or built",
      items: [
        {
          id: "round-timing",
          title: "Check whether boss rounds reach you too late",
          effort: "one run",
          why: [
            "The half-size ship narrowed the band where a boss round can touch you from about ±0.33 to ±0.21, so a round from the boss’s outermost gun now takes about 0.36 s to become dangerous instead of 0.275.",
            "If the fight feels soft in a run with god mode off, <code>RoundLaneResponse</code> 6.6 restores the old timing. It is one number, but only a run says whether it is needed."
          ]
        },
        {
          id: "shadow-spike",
          title: "Attribute the 8.4 ms shadow spike",
          effort: "one build + a capture",
          why: [
            "Bullet-light shadows went from five casters to one per volley, measured at sixty per cent less shadow geometry and half the draw calls. The seven lava lights lost their shadows entirely on 10 September, which takes more out of the same budget.",
            "But that measurement is submitted work from a paused editor frame with GPU timing unavailable. It proves the mechanism was large; it doesn’t prove it was the spike. A capture from a real run closes it."
          ]
        },
        {
          id: "pool-soak",
          title: "Soak-test enemy pooling",
          effort: "a few minutes of play",
          why: [
            "Done on 10 September, by instrumented run rather than by eye: eleven minutes of play with the player invulnerable, sampling every active enemy every ten seconds. The population grew from 15 to 77 and the pool was thoroughly exercised — <strong>82 distinct instances, 52 of them reused after despawn, 87 observed recycles</strong>. Far past the warmup, which is the only condition under which any of these defects can appear at all.",
            "<strong>Enemies dying to one bullet: absent.</strong> Not one recycled instance came back below full health, across all 87 recycles. Seven observations caught enemies sitting at partial health, so damage accumulates and sticks the way it should.",
            "<strong>Enemy_1 firing faster late in a run: absent.</strong> Over eighty seconds with 13 to 16 shooters, projectiles per shooter stayed flat and if anything trended down, and every shooter carried a pending invoke at every sample.",
            "<strong>The third was not tested, and this method cannot test it.</strong> An enemy setting off the wrong way round the ring is a property of the instant it spawns, and the chase recomputes direction from bearings on every frame after — so a sample taken seconds later shows the chase, not the spawn. That is now its own item below, rather than being quietly counted as passed."
          ]
        }
      ]
    }
  ];

  var PARKED = [
    ["Cloud shadow resolution as a quality rung", "Built on 16 September as 128/256/512, measured, and collapsed the same day. Against a control of two captures at one setting, every step of the ladder moved less of the frame than the clouds’ own reprojection does between frames. The Shadows row decides whether the clouds cast; their sharpness stays at the scene’s 256."],
    ["A fog Ultra tier above High", "Asked for on 14 September once the flicker was fixed, then cancelled before anything was built. The row stops at High, which is budget 0.333."],
    ["A TrailRenderer behind the rounds", "Tried on 14 September and replaced the same day. Under FSR, any trail built from past positions drifts off its round when the camera moves, whatever its material does, so the rounds carry a rigid streak instead."],
    ["The pale facets on the cone are not a bake artifact", "Chased on 10 September and dropped. The rock shows grey, desaturated faces next to deep red ones, and it looks like lightmap patchwork — it is not. The island is lit almost entirely by warm lava lights that are Mixed and therefore baked, so a face angled away from the lava receives only the cool sky ambient and reads grey. That is correct shading on flat-shaded low-poly rock. Two false starts are worth remembering: detaching the lightmap to test it proves nothing, because that removes nearly all the light on that rock at once; and comparing screenshots across the rebake proves nothing either, because the fog changed in the same step. Holding fog constant at 15 and re-rendering, the rebake made that flank about 10% darker and marginally less saturated, with 17% of pixels moving more than 12/255 — consistent with one fewer lava light, and nothing else. The facets were always there; the thinner fog stopped veiling them."],
    ["The world at ten times its size", "Tried on a branch, taken all the way to playable, and reversed on 9 September. It is not coming back: the scale bought nothing the importer could not, and the price was every number in the project and its documentation being wrong at once. What survives it is one piece of knowledge — a collider radius under a scaled root is a local number and rides the transform, a light range is handed to HDRP in world units and does not."],
    ["The boss HUD, the camera pull-back and the pink palette", "A readability pass on 8 September added a HUD naming the phase and the three targets, pulled the camera back during the fight, rewrote the dash tutorial and moved all hostile fire to pink with green pods. Reverted the same day; the four correctness fixes underneath it were kept. Only the colour half is still an open question — see “Decide whether the red pods actually read in play” above."],
    ["The wreckage plates stay dark", "Asked on 7 September and answered: no glow for now. They carry the boss’s hull material, which is nearly black, so one can vanish against the dark island — worth revisiting if the boss run shows it happening, but it is a deliberate no rather than an open question."],
    ["Overlapping offers stack their captions", "Levelling again while an offer is still out puts a second set on the ring rather than replacing the first — deliberate, because replacing it would delete an upgrade you earned."],
    ["Max Health is four ×5 instead of one ×20", "Same ceiling for a player who takes all four, lower for one who takes two. Whether that reads as a choice or a nerf is a question only playing answers."],
    ["Ray-traced rungs beyond reflections are unvalidated", "RT Reflections was confirmed in a build on DXR hardware. The rest are reachable and deliberately unused."],
    ["The DLSS path has never executed", "The dev machine is a Radeon, and HDRP requires an NVIDIA vendor string. The rows are correctly hidden; the code is unit-tested but has never run."],
    ["ActualRenderScale is not a bug", "Checked it — the two render-scale numbers can legitimately disagree, and the report shows both on purpose so you can see which is wrong."]
  ];

  var ALL = [];
  GROUPS.forEach(function (g) { g.items.forEach(function (it) { ALL.push(it); }); });
  ALL.push(NEXT);

  var stateEl = document.getElementById("state");
  var state;
  try { state = JSON.parse(stateEl.textContent) || {}; } catch (e) { state = {}; }
  if (!state.done || typeof state.done !== "object") { state.done = {}; }

  var writable = true;
  var pending = null;
  var api = null;

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // "why" copy is authored here and may carry <code>; everything from state is escaped.
  function tickSvg() {
    return '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.4l3 3 6-6.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function itemHtml(it, groupNote) {
    var isDone = !!state.done[it.id];
    var why = (it.why || []).map(function (p) { return "<p>" + p + "</p>"; }).join("");
    return '' +
      '<div class="item' + (isDone ? " is-done" : "") + '" data-id="' + esc(it.id) + '">' +
        '<button class="tick" type="button" role="checkbox" aria-checked="' + (isDone ? "true" : "false") +
          '" aria-label="' + esc(it.title) + '"' + (writable ? "" : " disabled") + '>' + tickSvg() + '</button>' +
        '<div class="title">' + esc(it.title) + '</div>' +
        '<div class="meta">' +
          '<span class="effort">' + esc(it.effort) + '</span>' +
          (isDone ? '<span class="flag">done</span>' : "") +
        '</div>' +
        (why ? '<details class="why"><summary>why</summary><div class="why-body">' + why + "</div></details>" : "") +
      "</div>";
  }

  function render() {
    var doneCount = 0;
    ALL.forEach(function (it) { if (state.done[it.id]) { doneCount++; } });
    var pct = ALL.length ? Math.round((doneCount / ALL.length) * 100) : 0;

    var nextDone = !!state.done[NEXT.id];

    var html = '' +
      "<header>" +
        "<h1>Survival Chaos — what’s left</h1>" +
        '<p class="sub">A living list. Tick something and it stays ticked for anyone who opens this. Nothing here is urgent and nothing here is overdue.</p>' +
        '<div class="meter">' +
          '<div class="track"><div class="fill" style="width:' + pct + '%"></div></div>' +
          "<span><b>" + doneCount + "</b> of <b>" + ALL.length + "</b> done</span>" +
          '<span id="saving"></span>' +
        "</div>" +
      "</header>";

    html += '' +
      '<section class="next">' +
        '<div class="next-kicker">' + (nextDone ? "Next · done" : "Start here") + "</div>" +
        "<h2>" + esc(NEXT.title) + "</h2>" +
        "<p>" + NEXT.lede + "</p>" +
        '<ul class="watch">' + NEXT.watch.map(function (w) { return "<li>" + esc(w) + "</li>"; }).join("") + "</ul>" +
        '<div class="group" style="margin-top:.5rem">' + itemHtml(NEXT) + "</div>" +
      "</section>";

    GROUPS.forEach(function (g) {
      var gd = 0;
      g.items.forEach(function (it) { if (state.done[it.id]) { gd++; } });
      html += '<section class="group">' +
        '<div class="group-head"><h2>' + esc(g.name) + '</h2>' +
        '<span class="count">' + gd + " / " + g.items.length + " · " + esc(g.note) + "</span></div>" +
        g.items.map(function (it) { return itemHtml(it); }).join("") +
        "</section>";
    });

    html += '<details class="parked"><summary>Decided — not doing (' + PARKED.length + ")</summary><ul>" +
      PARKED.map(function (p) { return "<li><strong>" + esc(p[0]) + ".</strong> " + esc(p[1]) + "</li>"; }).join("") +
      "</ul></details>";

    html += "<footer><span>Last edited by Claude: " + esc(state.updated || "") + "</span>" +
      "<span>" + (writable ? "Ticks save automatically" : "Read-only view — ticks won’t save") + "</span></footer>";

    document.getElementById("app").innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll(".tick"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.closest(".item").getAttribute("data-id");
        toggle(id);
      });
    });
  }

  function say(msg) {
    var el = document.getElementById("saving");
    if (el) { el.textContent = msg; }
  }

  function toggle(id) {
    if (!writable) { return; }
    if (state.done[id]) { delete state.done[id]; } else { state.done[id] = true; }
    render();
    say("saving…");
    schedulePublish();
  }

  // Batch rapid ticks into one publish; publish only after someone acts.
  function schedulePublish() {
    if (pending) { clearTimeout(pending); }
    pending = setTimeout(publish, 700);
  }

  function buildDoc() {
    var css = document.getElementById("css").textContent;
    var src = document.getElementById("app-src").textContent;
    var fonts = document.getElementById("fontlink").outerHTML;
    var open = "<" + "script";
    var close = "<" + "/script>";
    return "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n" +
      "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n" +
      "<title>Survival Chaos — Open List</title>\n" + fonts + "\n" +
      "<style id=\"css\">" + css + "</style>\n</head>\n<body>\n" +
      "<div class=\"wrap\" id=\"app\"></div>\n" +
      open + " id=\"state\" type=\"application/json\">" + JSON.stringify(state) + close + "\n" +
      open + " id=\"app-src\">" + src + close + "\n" +
      "</body>\n</html>";
  }

  var waitedForApi = 0;

  function publish() {
    pending = null;
    // A tick can land before use("artifact") has resolved. Wait for it a couple
    // of times rather than dropping the edit on the floor.
    if (!api) {
      if (writable && waitedForApi < 12) { waitedForApi++; schedulePublish(); return; }
      say("");
      return;
    }
    waitedForApi = 0;
    api.publish(buildDoc()).then(function () {
      say("saved");
      setTimeout(function () { say(""); }, 1600);
    }).catch(function (err) {
      var code = err && err.code;
      if (code === "conflict") {
        // Someone published first; every view reloads to the winner. No retry.
        say("");
        return;
      }
      if (code === "not_granted" || code === "not_writer") {
        writable = false;
        render();
        return;
      }
      say("couldn’t save");
    });
  }

  render();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (a) {
      if (!a) { writable = false; render(); return; }
      api = a;
    }).catch(function () { writable = false; render(); });
  } else {
    writable = false;
    render();
  }
})();
</script>
