<style id="css">
  /* Neutrals carry a slight green bias so they read as chosen rather than
     inherited; one burnt-orange accent marks the single thing to do next, and
     nothing else in the page is allowed to use it. */
  :root {
    --ground:   #F6F8F6;
    --surface:  #FFFFFF;
    --sunk:     #EDF1EE;
    --line:     #DCE3DE;
    --line-2:   #C7D1CB;
    --ink:      #141817;
    --ink-2:    #58635E;
    --ink-3:    #8B948F;
    --accent:   #B4531A;
    --accent-b: #B4531A18;
    --done:     #3F6B4A;
    --shadow:   0 1px 2px #0F1A140F, 0 8px 24px -18px #0F1A1433;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:   #0F1312;
      --surface:  #171C1A;
      --sunk:     #1E2422;
      --line:     #29312E;
      --line-2:   #3A443F;
      --ink:      #E9EEEB;
      --ink-2:    #9AA49F;
      --ink-3:    #6D7772;
      --accent:   #F08A3C;
      --accent-b: #F08A3C1F;
      --done:     #74B184;
      --shadow:   0 1px 0 #FFFFFF08 inset, 0 12px 32px -22px #000000CC;
    }
  }

  :root[data-theme="dark"] {
    --ground:   #0F1312;
    --surface:  #171C1A;
    --sunk:     #1E2422;
    --line:     #29312E;
    --line-2:   #3A443F;
    --ink:      #E9EEEB;
    --ink-2:    #9AA49F;
    --ink-3:    #6D7772;
    --accent:   #F08A3C;
    --accent-b: #F08A3C1F;
    --done:     #74B184;
    --shadow:   0 1px 0 #FFFFFF08 inset, 0 12px 32px -22px #000000CC;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 47rem;
    margin: 0 auto;
    padding: clamp(1.6rem, 5vw, 3.4rem) clamp(1rem, 4vw, 2rem) 5rem;
    display: flex;
    flex-direction: column;
    gap: 2.1rem;
  }

  h1, h2, .next-kicker {
    font-family: "Bricolage Grotesque", "Segoe UI Semibold", system-ui, sans-serif;
  }

  h1 {
    font-size: clamp(1.7rem, 4.4vw, 2.3rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0;
    text-wrap: balance;
  }

  .sub { color: var(--ink-2); margin: 0.35rem 0 0; max-width: 34rem; }

  .meter {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-top: 1rem;
    font-size: 0.85rem;
    color: var(--ink-2);
  }
  .meter .track {
    flex: 1;
    max-width: 12rem;
    height: 5px;
    border-radius: 3px;
    background: var(--sunk);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .meter .fill {
    height: 100%;
    background: var(--done);
    width: 0;
    transition: width 0.25s ease;
  }
  .meter b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ---------- the one next thing ---------- */
  .next {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 5px;
    padding: 1.15rem 1.25rem;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .next-kicker {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .next h2 { font-size: 1.22rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .next p { margin: 0; color: var(--ink-2); }
  .next .watch { margin: 0.35rem 0 0; padding-left: 1.05rem; display: flex; flex-direction: column; gap: 0.3rem; }
  .next .watch li { color: var(--ink-2); }
  .next .watch li::marker { color: var(--accent); }

  /* ---------- groups ---------- */
  .group { display: flex; flex-direction: column; gap: 0.55rem; }
  .group-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding-bottom: 0.35rem;
    border-bottom: 1px solid var(--line);
  }
  .group-head h2 {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin: 0;
  }
  .group-head .count {
    font-size: 0.76rem;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* ---------- item ---------- */
  .item {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 0.7rem 0.85rem;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.15rem 0.75rem;
  }
  .item.is-done { background: transparent; border-color: var(--line); }

  .tick {
    grid-row: 1 / span 3;
    width: 1.45rem;
    height: 1.45rem;
    margin-top: 0.12rem;
    border-radius: 4px;
    border: 1.5px solid var(--line-2);
    background: var(--sunk);
    display: grid;
    place-items: center;
    cursor: pointer;
    padding: 0;
    color: transparent;
    flex: none;
  }
  .tick:hover { border-color: var(--ink-3); }
  .tick[aria-checked="true"] {
    background: var(--done);
    border-color: var(--done);
    color: #fff;
  }
  .tick svg { width: 0.85rem; height: 0.85rem; display: block; }
  .tick[disabled] { cursor: default; opacity: 0.55; }

  .title {
    font-weight: 600;
    line-height: 1.35;
    align-self: center;
  }
  .is-done .title { text-decoration: line-through; color: var(--ink-3); font-weight: 500; }

  .meta {
    grid-column: 2;
    font-size: 0.78rem;
    color: var(--ink-3);
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    align-items: center;
  }
  .meta .effort {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    background: var(--sunk);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0.05em 0.4em;
    white-space: nowrap;
  }
  .meta .flag {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--done);
  }

  details.why { grid-column: 2; margin-top: 0.3rem; }
  details.why > summary {
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--ink-2);
    list-style: none;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.1rem 0;
  }
  details.why > summary::-webkit-details-marker { display: none; }
  details.why > summary::before {
    content: "";
    width: 0; height: 0;
    border-left: 4px solid currentColor;
    border-top: 3.5px solid transparent;
    border-bottom: 3.5px solid transparent;
    transition: transform 0.15s ease;
  }
  details.why[open] > summary::before { transform: rotate(90deg); }
  details.why > summary:hover { color: var(--ink); }
  .why-body {
    margin: 0.4rem 0 0.15rem;
    padding-left: 0.72rem;
    border-left: 2px solid var(--line);
    color: var(--ink-2);
    font-size: 0.92rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .why-body p { margin: 0; }
  .why-body code {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.86em;
    background: var(--sunk);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0.03em 0.3em;
  }

  /* ---------- parked ---------- */
  details.parked {
    background: var(--sunk);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 0.7rem 0.9rem;
  }
  details.parked > summary {
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-2);
    list-style: none;
  }
  details.parked > summary::-webkit-details-marker { display: none; }
  details.parked ul { margin: 0.75rem 0 0.2rem; padding-left: 1.05rem; display: flex; flex-direction: column; gap: 0.5rem; }
  details.parked li { color: var(--ink-2); font-size: 0.93rem; }
  details.parked li::marker { color: var(--ink-3); }
  details.parked strong { color: var(--ink); font-weight: 600; }

  footer {
    border-top: 1px solid var(--line);
    padding-top: 0.9rem;
    font-size: 0.82rem;
    color: var(--ink-3);
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1rem;
    justify-content: space-between;
  }
  #saving { color: var(--ink-3); font-size: 0.82rem; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 30rem) {
    .item { padding: 0.65rem 0.7rem; }
  }
</style>

<script id="state" type="application/json">{"done": {"code-variant": true, "cloud-bank": true, "charge-sound": true, "enemy-shot-glow": true, "play-boss": true, "identity": true, "stray-log": true, "commit-files": true, "shadow-count": true}, "updated": "8 September 2026"}</script>

<script id="app-src">
(function () {
  "use strict";

  // The single thing to do next. Deliberately one, not a shortlist: picking is
  // the expensive part, so the page does it rather than handing over a menu.
  var NEXT = {
    id: "play-lightfixes",
    title: "Play the light-fixes build",
    effort: "one run, ~10 minutes",
    lede: "<code>Builds/26_0908-0930_lightfixes/</code> is the first build carrying all four of the last day’s changes, and <strong>none of them has been played</strong>: the armoured act cut from 450 to 300, the boss’s bullet lights moved onto its rounds instead of sitting 2.66 units under them, the lance’s four prow muzzles staggered so they stop firing as one, and the light ceiling raised so they stop vanishing at close range. Four changes, one run — and four other things on this list are answered just by looking while you are already in there.",
    watch: [
      "Does the fight still run long, now the armoured act is a third shorter? That act was half the whole health bar, which is why the cut landed there alone and nothing else moved.",
      "Are the boss’s rounds lit at the round rather than under it — and do the lights stay put as bullets pass each other, instead of hopping between them?",
      "Does the lance read as four muzzles now, or still as one smear? That decides the lance item below.",
      "Can you find the red pods against the orange lava? That answers the pod item below, which has been open since they turned red.",
      "Does Enemy 3 disappear against the dark island? That answers the silhouette item below.",
      "Anything odd late in the run — enemies dying to one hit, an enemy setting off the wrong way round the ring, Enemy_1 firing faster than it should. That is the pooling soak, for free."
    ]
  };

  var GROUPS = [
    {
      id: "you",
      name: "Needs you",
      note: "I can’t do these for you",
      items: [
        {
          id: "charge-sound",
          title: "Pick a charge sound for the lance and the ram",
          effort: "30 min",
          why: [
            "Done, and synthesised rather than picked. Nothing in the packs is a charge — measured, every engine and thruster is a flat five-second drone and the only things that rise are door slams — so both were made with the project’s own SfxrSynth, called directly rather than through the menu item that would have replaced every sound in the game.",
            "The lance rises 198 to 694Hz over 1.15s against a 1.2s wind-up; the ram spools from a 39Hz fundamental under a low-pass that opens. The lance’s is cut short if you shoot the prow emplacement mid-charge, which needed a Stop the audio system did not have."
          ]
        },
        {
          id: "play-boss",
          title: "Play a full boss run",
          effort: "5 min",
          why: [
            "Done, twice. The 7 September run reported both acts as easy, which is what the retune answered; the 8 September build was played to check the pause, debug and ending fixes.",
            "A third run on 8 September said it felt good but ran long. That is what cut the armoured act from 450 to 300 and the boss from 900 to 750 — that act alone was half the whole bar, and the only one that made you fly between three heights, so it owned a disproportionate share of the clock.",
            "Everything the fight is tuned to now came out of those runs rather than out of a probe with the ship parked."
          ]
        },
        {
          id: "hit-clip",
          title: "Pick a punchier clip for taking damage",
          effort: "10 min",
          why: [
            "<code>PlayerHit</code> is the anchor of the whole mix and it is the weakest clip in the set — measured over its loudest 300ms it is the quietest thing there. Because <code>volume</code> caps at 1, everything else had to come down to sit under it, which is why the game is now about 6dB quieter overall.",
            "A clip with more in it would let the whole ladder come back up. BalanceSoundLevels says this itself: something that hits the ceiling before reaching the target wants a different clip, not more gain."
          ]
        },
        {
          id: "jam-branches",
          title: "Decide on the 18 stale 2023 jam branches",
          effort: "5 min",
          why: [
            "They’re dead, but they’re also the only record of who did what on the original five-person project. Keep or delete — either is fine, it just wants deciding once."
          ]
        },
        {
          id: "enemy-shot-glow",
          title: "Decide what the ordinary enemies’ shots should look like",
          effort: "2 min to decide",
          why: [
            "Done — warmed, rather than given their own tag. All hostile fire now reads warm on one ladder below the boss’s own rounds.",
            "Their materials were embedded in <code>tiro_inimigo_2.fbx</code>, so they are new assets with the base greys copied across untouched. Only emission was added, which is deliberately not what happened the time the palette got rejected."
          ]
        },
        {
          id: "pod-visibility",
          title: "Decide whether the red pods actually read in play",
          effort: "2 min to decide",
          why: [
            "The pods were green until 5 September, and the comment written when they turned red flagged the cost at the time: a red pod against orange lava is a harder read than a green one was, and this would be the first thing to question if the armoured phase turned out to be hard to aim at.",
            "On 8 September a second pass reached the same diagnosis from scratch and moved every hostile thing off orange — pink fire, green pods. You reverted it, and its version did wash a third of the island green. But that rejects the execution, not the diagnosis. If you were hunting for pods, there is a much smaller version: keep the red and drop <code>PodLightLumens</code> from 9000, so the target reads without the arena changing colour."
          ]
        },
        {
          id: "lance-legibility",
          title: "Decide whether the lance stream can be told apart",
          effort: "2 min to decide",
          why: [
            "The lance throws forty rounds over 0.6s from four prow muzzles sitting 0.53 to 2.37 units apart. Each round is 12.86 units long and travels at 80, so consecutive shots leave 0.16s apart and far closer together than their own length — they overlap by construction, which is why it looked like the bullets were glued to each other.",
            "Staggering the muzzles by 0.02s unstacked the four that were firing as one, and that was the half of the problem timing could reach. Nothing about cadence can separate the stream itself: at that length and that speed the rounds cannot help but touch. If it still reads as one smear, the fix is a shorter round — and that changes how the weapon looks, so it is your call rather than mine."
          ]
        },
        {
          id: "enemy3-silhouette",
          title: "Decide how to make Enemy 3 readable",
          effort: "2 min to decide",
          why: [
            "Its body is <code>(0.00, 0.03, 0.00)</code> — near black. Against the dark island it is a silhouette, which is the one enemy that genuinely disappears.",
            "The magenta accent was tried and you rejected it for killing the original look, so this needs your call rather than another attempt: lift the base value slightly, add one bright plate as an accent, or a rim-fresnel shader that keeps every colour as it is and only lights the edges. Leaving it is also an answer."
          ]
        }
      ]
    },
    {
      id: "me",
      name: "I can do these alone",
      note: "Just say go",
      items: [
        {
          id: "cloud-bank",
          title: "Switch the cloud bank back on",
          effort: "15 min",
          why: [
            "Done. It was off with <code>m_IsActive: 0</code> because a bake needed it out of the way, and it never went back on — so the sparsity work you tuned wasn’t being rendered by anything.",
            "It came back at 600×220×600 rather than the 2000 it had drifted to, tiling 2×1×2, against a mask rebaked at 128³ so the features are smaller than the tile. The first attempt at 6×2×6 had a pattern you could read."
          ]
        },
        {
          id: "cloud-drift",
          title: "Try the cloud bank with the drift switched off",
          effort: "5 min",
          why: [
            "<code>ArenaCloudBank.driftSpeed</code> is 8, down from 25, because the texture sliding was the thing you could see. Slower is quieter, but it is the same tell.",
            "At 0 the banks hold still and all the parallax comes from your own orbit instead — which is motion the player is causing rather than motion happening to them. Untried; it is one field."
          ]
        },
        {
          id: "loudness-metric",
          title: "Match clips on windowed loudness, not gated RMS",
          effort: "45 min",
          why: [
            "<code>BalanceSoundLevels</code> normalises every clip to the same gated RMS, and that is not what a listener hears: two clips both balanced to -16 dBFS measured 13dB apart over their loudest 300ms. That gap is why the mix drifted so far.",
            "<code>IntentDb</code> is currently carrying both the design judgement it is for and a correction for that gap, which is written down as the compromise it is. Fixing the metric would let it go back to being purely about how often a sound fires — but it rewrites every file in <code>Balanced/</code>, so it wants doing deliberately rather than in passing."
          ]
        },
        {
          id: "shadow-count",
          title: "Drop shadowCastingCount from 4 to 2",
          effort: "2 min",
          why: [
            "Done on 8 September. The player’s bullet pool is at 2. The enemy pool was already at 0 and stays there — their shots glow but cast nothing.",
            "It cost nothing late in a run — once Shot Upgrade lands only two volleys are lit — but meant four casters in the opening minute, when every bullet is its own volley and there is least else on screen to justify them."
          ]
        },
        {
          id: "identity",
          title: "Give the game its own identity",
          effort: "5 min",
          why: [
            "Done on 8 September: <code>Ian Wanderley</code> / <code>Survival Chaos</code> / <code>0.9.0</code>, with an explicit <code>com.ianwanderley.survivalchaos</code> rather than the identifier Unity derives.",
            "The company name is the least settled of the four. Nothing in the repo records a team name for the original five, so it came from your own git author name — it is one field and changes on a word. Note it also moves where settings live, so one previous build’s graphics and audio choices will not be found the first time."
          ]
        },
        {
          id: "stray-log",
          title: "Untrack replay_pid25368.log",
          effort: "2 min",
          why: [
            "Done on 8 September. Untracked, deleted, and <code>replay_pid*.log</code> added to .gitignore so the next one is never staged in the first place."
          ]
        },
        {
          id: "commit-files",
          title: "Clear the commit-*.txt scratch files",
          effort: "1 min",
          why: [
            "Done on 8 September. All three deleted from the outer folder — every one of them had been committed long before."
          ]
        },
        {
          id: "code-variant",
          title: "Set the Managed Code Variant back to Release",
          effort: "1 min",
          why: [
            "Done, and done again on 6 September: it goes to <strong>Checked</strong> for the length of a debug build and straight back to <strong>Release</strong> afterwards, so the repo never sits in the state that ships a menu handing out levels and invulnerability.",
            "Unity 6.6 moved this off the Development Build checkbox and onto a dropdown in Player Settings, so ticking that box no longer brings the menu back. Ask for a debug build and I will flip it both ways around the build — the exe keeps its menu either way, since the setting only affects the next one."
          ]
        }
      ]
    },
    {
      id: "later",
      name: "Waiting on a real run",
      note: "Blocked until something is played or built",
      items: [
        {
          id: "shadow-spike",
          title: "Attribute the 8.4 ms shadow spike",
          effort: "one build + a capture",
          why: [
            "Bullet-light shadows went from five casters to one per volley, measured at sixty per cent less shadow geometry and half the draw calls.",
            "But that measurement is submitted work from a paused editor frame with GPU timing unavailable. It proves the mechanism was large; it doesn’t prove it was the spike. A capture from a real run closes it."
          ]
        },
        {
          id: "pool-soak",
          title: "Soak-test enemy pooling",
          effort: "a few minutes of play",
          why: [
            "Pooling defects can’t appear until the warmup is exhausted and instances start recycling, which takes minutes.",
            "Three things to watch for: enemies dying to one bullet regardless of type, an enemy setting off the wrong way round the ring, and Enemy_1 firing faster the longer a run goes on.",
            "It costs nothing extra to do it in the light-fixes build — it is the same run as the one at the top of this list."
          ]
        }
      ]
    }
  ];

  var PARKED = [
    ["The boss HUD, the camera pull-back and the pink palette", "A readability pass on 8 September added a HUD naming the phase and the three targets, pulled the camera back during the fight, rewrote the dash tutorial and moved all hostile fire to pink with green pods. Reverted the same day; the four correctness fixes underneath it were kept. Only the colour half is still an open question — see “Decide whether the red pods actually read in play” above."],
    ["The wreckage plates stay dark", "Asked on 7 September and answered: no glow for now. They carry the boss’s hull material, which is nearly black, so one can vanish against the dark island — worth revisiting if the boss run shows it happening, but it is a deliberate no rather than an open question."],
    ["Overlapping offers stack their captions", "Levelling again while an offer is still out puts a second set on the ring rather than replacing the first — deliberate, because replacing it would delete an upgrade you earned."],
    ["Max Health is four ×5 instead of one ×20", "Same ceiling for a player who takes all four, lower for one who takes two. Whether that reads as a choice or a nerf is a question only playing answers."],
    ["Ray-traced rungs beyond reflections are unvalidated", "RT Reflections was confirmed in a build on DXR hardware. The rest are reachable and deliberately unused."],
    ["The DLSS path has never executed", "The dev machine is a Radeon, and HDRP requires an NVIDIA vendor string. The rows are correctly hidden; the code is unit-tested but has never run."],
    ["ActualRenderScale is not a bug", "Checked it — the two render-scale numbers can legitimately disagree, and the report shows both on purpose so you can see which is wrong."]
  ];

  var ALL = [];
  GROUPS.forEach(function (g) { g.items.forEach(function (it) { ALL.push(it); }); });
  ALL.push(NEXT);

  var stateEl = document.getElementById("state");
  var state;
  try { state = JSON.parse(stateEl.textContent) || {}; } catch (e) { state = {}; }
  if (!state.done || typeof state.done !== "object") { state.done = {}; }

  var writable = true;
  var pending = null;
  var api = null;

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // "why" copy is authored here and may carry <code>; everything from state is escaped.
  function tickSvg() {
    return '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.4l3 3 6-6.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function itemHtml(it, groupNote) {
    var isDone = !!state.done[it.id];
    var why = (it.why || []).map(function (p) { return "<p>" + p + "</p>"; }).join("");
    return '' +
      '<div class="item' + (isDone ? " is-done" : "") + '" data-id="' + esc(it.id) + '">' +
        '<button class="tick" type="button" role="checkbox" aria-checked="' + (isDone ? "true" : "false") +
          '" aria-label="' + esc(it.title) + '"' + (writable ? "" : " disabled") + '>' + tickSvg() + '</button>' +
        '<div class="title">' + esc(it.title) + '</div>' +
        '<div class="meta">' +
          '<span class="effort">' + esc(it.effort) + '</span>' +
          (isDone ? '<span class="flag">done</span>' : "") +
        '</div>' +
        (why ? '<details class="why"><summary>why</summary><div class="why-body">' + why + "</div></details>" : "") +
      "</div>";
  }

  function render() {
    var doneCount = 0;
    ALL.forEach(function (it) { if (state.done[it.id]) { doneCount++; } });
    var pct = ALL.length ? Math.round((doneCount / ALL.length) * 100) : 0;

    var nextDone = !!state.done[NEXT.id];

    var html = '' +
      "<header>" +
        "<h1>Survival Chaos — what’s left</h1>" +
        '<p class="sub">A living list. Tick something and it stays ticked for anyone who opens this. Nothing here is urgent and nothing here is overdue.</p>' +
        '<div class="meter">' +
          '<div class="track"><div class="fill" style="width:' + pct + '%"></div></div>' +
          "<span><b>" + doneCount + "</b> of <b>" + ALL.length + "</b> done</span>" +
          '<span id="saving"></span>' +
        "</div>" +
      "</header>";

    html += '' +
      '<section class="next">' +
        '<div class="next-kicker">' + (nextDone ? "Next · done" : "Start here") + "</div>" +
        "<h2>" + esc(NEXT.title) + "</h2>" +
        "<p>" + NEXT.lede + "</p>" +
        '<ul class="watch">' + NEXT.watch.map(function (w) { return "<li>" + esc(w) + "</li>"; }).join("") + "</ul>" +
        '<div class="group" style="margin-top:.5rem">' + itemHtml(NEXT) + "</div>" +
      "</section>";

    GROUPS.forEach(function (g) {
      var gd = 0;
      g.items.forEach(function (it) { if (state.done[it.id]) { gd++; } });
      html += '<section class="group">' +
        '<div class="group-head"><h2>' + esc(g.name) + '</h2>' +
        '<span class="count">' + gd + " / " + g.items.length + " · " + esc(g.note) + "</span></div>" +
        g.items.map(function (it) { return itemHtml(it); }).join("") +
        "</section>";
    });

    html += '<details class="parked"><summary>Decided — not doing (' + PARKED.length + ")</summary><ul>" +
      PARKED.map(function (p) { return "<li><strong>" + esc(p[0]) + ".</strong> " + esc(p[1]) + "</li>"; }).join("") +
      "</ul></details>";

    html += "<footer><span>Last edited by Claude: " + esc(state.updated || "") + "</span>" +
      "<span>" + (writable ? "Ticks save automatically" : "Read-only view — ticks won’t save") + "</span></footer>";

    document.getElementById("app").innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll(".tick"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.closest(".item").getAttribute("data-id");
        toggle(id);
      });
    });
  }

  function say(msg) {
    var el = document.getElementById("saving");
    if (el) { el.textContent = msg; }
  }

  function toggle(id) {
    if (!writable) { return; }
    if (state.done[id]) { delete state.done[id]; } else { state.done[id] = true; }
    render();
    say("saving…");
    schedulePublish();
  }

  // Batch rapid ticks into one publish; publish only after someone acts.
  function schedulePublish() {
    if (pending) { clearTimeout(pending); }
    pending = setTimeout(publish, 700);
  }

  function buildDoc() {
    var css = document.getElementById("css").textContent;
    var src = document.getElementById("app-src").textContent;
    var fonts = document.getElementById("fontlink").outerHTML;
    var open = "<" + "script";
    var close = "<" + "/script>";
    return "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n" +
      "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n" +
      "<title>Survival Chaos — Open List</title>\n" + fonts + "\n" +
      "<style id=\"css\">" + css + "</style>\n</head>\n<body>\n" +
      "<div class=\"wrap\" id=\"app\"></div>\n" +
      open + " id=\"state\" type=\"application/json\">" + JSON.stringify(state) + close + "\n" +
      open + " id=\"app-src\">" + src + close + "\n" +
      "</body>\n</html>";
  }

  var waitedForApi = 0;

  function publish() {
    pending = null;
    // A tick can land before use("artifact") has resolved. Wait for it a couple
    // of times rather than dropping the edit on the floor.
    if (!api) {
      if (writable && waitedForApi < 12) { waitedForApi++; schedulePublish(); return; }
      say("");
      return;
    }
    waitedForApi = 0;
    api.publish(buildDoc()).then(function () {
      say("saved");
      setTimeout(function () { say(""); }, 1600);
    }).catch(function (err) {
      var code = err && err.code;
      if (code === "conflict") {
        // Someone published first; every view reloads to the winner. No retry.
        say("");
        return;
      }
      if (code === "not_granted" || code === "not_writer") {
        writable = false;
        render();
        return;
      }
      say("couldn’t save");
    });
  }

  render();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (a) {
      if (!a) { writable = false; render(); return; }
      api = a;
    }).catch(function () { writable = false; render(); });
  } else {
    writable = false;
    render();
  }
})();
</script>
